<!DOCTYPE html>
<html lang="pt-mz">
<head>
  <meta charset="UTF-8" />
  <title>Lfentregadora.Lda - Cadastro</title>
  <link rel="stylesheet" href="Indice.css" />
  <link rel="stylesheet" href="Cadastro.css" />
</head>
<body>
<nav>
 <h1>LFentregadora.Lda</h1>
 <button id="botao"><a href="Segunda pagina.html">Voltar</a></button>
</nav>
  <div class="lista-frames">

    <section class="frame tela-cadastro">

      <div class="cabecalho-cadastro">
        <div class="topo-marca" style="padding:0;">
                 
        </div>
         </div>
        <h2 class="titulo-pagina">Cadastro</h2>
     

      <div class="linha-dupla">
        <div>
          <div class="campo-form">
            <label>Nome completo:</label>
            <input type="text" placeholder="Digite o seu nome" required >
          </div>
          <div class="campo-form">
            <label>Apelido:</label>
            <input type="text" placeholder="Digite o seu apelido" required>
          </div>
          <div class="campo-form">
            <label>Data de nascimento:</label>
            <input type="text" placeholder="Digite a sua data de nascimento" required>
          </div>
          <div class="campo-form">
            <label>N. de BI:</label>
            <input type="text" placeholder="Digite o numero de BI" required>
          </div>
          <div class="campo-form">
            <label>E-mail:</label>
            <input type="text" placeholder="Digite o seu e-mail" required>
          </div>
        </div>

        <div>
          <div class="campo-form">
            <label>Palavra-passe:</label>
            <input type="password" placeholder="Digite a sua palavra-passe" required>
          </div>
          <div class="campo-form">
            <label>Confirmar palavra-passe</label>
            <input type="password" placeholder="Confirme a sua palavra-passe" required>
          </div>
          <div class="campo-form">
            <label>Contacto/os:</label>
            <input type="text" placeholder="Digite o/os seu/us contacto/os" required >
          </div>
          <div class="campo-form">
            <label>Sexo:</label>
            <div class="opcoes-sexo">
              <label><input type="radio" name="sexo" required> Femenino</label>
              <label><input type="radio" name="sexo" required> Masculino</label>
            </div>
          </div>

          <div style="text-align:right; margin-top:20px;">
            <button id="botao-principal"><a href="pagina principal.html">Enviar</a></button>
          </div>
        </div>
      </div>
    
    </section>

  </div>
</body>
</html>
